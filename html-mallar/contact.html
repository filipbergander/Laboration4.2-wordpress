<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakta Travel Meraviglia</title>
    <meta name="description" content="Kontakta Travel Meraviglia för att börja planera din nästa resa. Skicka en förfrågan till våra reseexperter så återkommer vi med förslag.">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/style.css">
    <script src="src/js/main.js" defer></script>
    <link rel="icon" type="image/png" href="images/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="images/favicon/favicon.svg">
    <link rel="shortcut icon" href="images/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="TravelM">
    <link rel="manifest" href="images/favicon/site.webmanifest">
</head>

<body>
    <header>
        <a href="index.html"><img src="images/logo/logo-tm.png" alt="Travel Meraviglia Logo" id="logo"></a>
        <nav class="main-nav" aria-label="Huvudmeny">
            <ul>
                <li><a href="index.html">Hem</a></li>
                <li><a href="journey.html">Resor</a></li>
                <li><a href="contact.html" aria-current="page">Kontakt</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Kontakta oss</h1>
        <form id="contact-form">
            <fieldset>
                <legend>Har du frågor?</legend>
                <p>Fyll i formuläret nedan så kontaktar vi dig så snart som möjligt.</p>

                <div class="label-div">
                    <label for="name">Namn:</label>
                    <input type="text" id="name" name="name" placeholder="Ange ditt namn" minlength="2" maxlength="50" required>
                </div>

                <div class="label-div">
                    <label for="email">E-post:</label>
                    <input type="email" id="email" placeholder="Ange din e-post" minlength="5" maxlength="100" name="email" required>
                </div>

                <div class="label-div">
                    <label for="message">Meddelande:</label>
                    <textarea id="message" placeholder="Skriv din förfrågan här..." name="message" maxlength="700" required></textarea>
                </div>
            </fieldset>

            <button class="form-btn" type="submit">Skicka förfrågan</button>
        </form>
    </main>
    <footer>
        <p>Travel Meraviglia - Upptäck världen med oss</p>
        <nav class="footer-nav" aria-label="Sidfotsmeny">
            <ul>
                <li><a href="ai.html">AI-verktyg</a></li>
                <li><a href="about.html">Om oss</a></li>
            </ul>
        </nav>
        <p>&copy; 2026 Travel Meraviglia</p>
    </footer>
</body>

</html>
